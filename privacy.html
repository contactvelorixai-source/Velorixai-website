<script type="application/json" id="page-data">{"eyebrow":"LEGAL","icon":"shield-check","accent":"analytics","title":"Privacy Policy","updated":"2 September 2026","lead":"This policy explains what information VelorixAI collects, why we collect it, who we share it with, and the control you have over it.","sections":[{"h":"Information you give us","p":["When you book a demo or subscribe, we collect the details you enter: your name, email address, phone number, business name and anything you write in the message field.","Once you are using the platform, we also hold the content you create and the contact records you import or capture."]},{"h":"Information we collect automatically","p":["Like most websites, we record basic technical information when you visit, browser type, device, approximate location and the pages you view. This helps us keep the site working and understand which sections are useful."],"list":["We do not sell your personal data to anyone.","We do not use your business content to train third-party models.","We do not track you across unrelated websites."]},{"h":"Why we use it","p":["We use your information to provide the platform, to contact you about your demo or subscription, to deliver support, and to send service updates about features and billing.","We only send marketing messages where you have agreed to receive them, and every message includes a way to stop them."]},{"h":"Who we share it with","p":["We share data with the service providers who make the platform work, hosting, payment processing, email and messaging delivery, and scheduling. Each is bound to use it only for the service they provide to us.","We may also disclose information where the law requires it, or to protect our rights or the safety of others."]},{"h":"Where your data is held","p":["Your data is stored on secured servers and protected in transit. Some of our providers operate outside India; where that is the case, we take steps to ensure your data receives an equivalent level of protection."]},{"h":"How long we keep it","p":["We keep account data for as long as your subscription is active and for a reasonable period afterwards to meet legal and accounting obligations.","Demo enquiries that do not become subscriptions are removed after 24 months."]},{"h":"Your rights","p":["You can ask us to show you the data we hold about you, correct anything inaccurate, export it, or delete it."],"list":["Access, request a copy of your data.","Correction, have inaccurate details fixed.","Export, receive your data in a portable format.","Deletion, ask us to remove your data, subject to legal retention.","Objection, ask us to stop a particular use, including marketing."]},{"h":"Cookies","p":["We use a small number of cookies to keep the site working and to understand how it is used. You can block or clear cookies in your browser; some parts of the platform may not work correctly if you do."]},{"h":"Children","p":["VelorixAI is a business tool and is not directed at anyone under 18. We do not knowingly collect data from children."]},{"h":"Changes and contact","p":["We update this policy as the platform changes, and the date above always reflects the current version.","To exercise any of your rights or ask a question, write to contact.velorixai@gmail.com."]}]}</script>
