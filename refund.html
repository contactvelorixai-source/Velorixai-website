<script type="application/json" id="page-data">{"eyebrow":"LEGAL","icon":"receipt","accent":"gold","title":"Refund Policy","updated":"2 September 2026","lead":"This policy explains when a VelorixAI subscription can be cancelled, what happens to your access, and the circumstances in which a refund applies.","sections":[{"h":"Before you subscribe","p":["Every subscription begins with a free 30-minute demo. There is no cost and no obligation attached to it, we use the session to show you the platform and agree the plan that fits your business.","We encourage you to raise any question about apps, tokens or bonuses during the demo, before any payment is made."]},{"h":"Cancelling your subscription","p":["You may cancel at any time by writing to contact.velorixai@gmail.com or messaging us on WhatsApp.","On cancellation, your subscription remains active until the end of the term you have already paid for. We do not automatically renew a cancelled plan."],"list":["Quarterly plans run to the end of the current 3-month term.","Annual plans run to the end of the current 12-month term.","Your data stays available for export for 30 days after the term ends."]},{"h":"When a refund applies","p":["We issue a refund where we have failed to deliver what was agreed, for example, if the platform is unavailable for a sustained period through our fault, or if a paid feature set was never provisioned to your account.","Requests should be sent within 14 days of the issue, with enough detail for us to investigate. We respond to every request within 7 working days."]},{"h":"When a refund does not apply","p":["Because access, token allowances and bonuses are provisioned immediately, some parts of a subscription cannot be returned once used."],"list":["Tokens that have already been consumed.","A free website or authority book where work has begun or been delivered.","Time remaining on a term that you have chosen to stop using.","Results not matching expectations, where the platform is working as described."]},{"h":"Annual bonuses","p":["If you cancel an annual plan after a free website or authority book has been produced, the fair market value of that deliverable may be deducted from any refund due.","If work has not yet started, the bonus is simply withdrawn and no deduction applies."]},{"h":"Changing plans","p":["You can move between plans at any point after sign-up. Upgrades take effect immediately and the difference is charged pro rata. Downgrades take effect at the start of your next term."]},{"h":"How refunds are paid","p":["Approved refunds are returned to the original payment method within 7 to 10 working days of approval. Timing beyond that point depends on your bank or card issuer.","Any applicable taxes are refunded in line with the original invoice."]},{"h":"Getting in touch","p":["For anything relating to cancellations, refunds or billing, email contact.velorixai@gmail.com or message +91 8218854770 on WhatsApp. Include your registered email address so we can find your account quickly."]}]}</script>
